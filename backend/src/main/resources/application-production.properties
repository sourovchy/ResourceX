# Production profile (Railway). Activated by SPRING_PROFILES_ACTIVE=production.
# Mirrors application-prod.properties and adds cross-site defaults for the
# Vercel-hosted frontend so no extra Railway env vars are strictly required.
spring.jpa.show-sql=false
spring.mail.properties.mail.debug=false
logging.level.org.springframework.mail=WARN
logging.level.com.resourcex=INFO
spring.jpa.hibernate.ddl-auto=validate

# Allow the deployed frontend origin (override with CORS_ALLOWED_ORIGINS if it changes).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://resourcex-web.vercel.app}

# Cross-site auth cookie (frontend on vercel.app, backend on railway.app).
# SameSite=None + Secure are required for the cookie to be sent cross-site over HTTPS.
app.cookie.same-site=${COOKIE_SAME_SITE:None}
app.cookie.secure=${COOKIE_SECURE:true}

# Behind Railway's edge proxy, so the real client IP arrives in X-Forwarded-For.
# Trust it here for accurate per-client rate limiting. (Stays false by default in
# dev / direct deployments, where the header would be attacker-controlled.)
app.security.trust-forwarded-for=${TRUST_FORWARDED_FOR:true}
