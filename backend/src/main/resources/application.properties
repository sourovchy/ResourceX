spring.application.name=resourcex
spring.config.import=optional:file:../.env[.properties]
# Datasource resolution order: Railway-native MYSQL* vars -> DB_* (.env/local) -> localhost defaults.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:${DB_HOST:localhost}}:${MYSQLPORT:${DB_PORT:3306}}/${MYSQLDATABASE:${DB_NAME:resourcex}}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Batch lazy-association loading (IN-clause) to curb N+1 on list endpoints
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jackson.time-zone=UTC

app.otp.cleanup.fixed-delay-ms=3600000

server.port=${PORT:8082}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}

# Auth cookie cross-site config. Local dev defaults to Lax/insecure (http://localhost).
# In production (frontend and backend on different domains) set COOKIE_SAME_SITE=None and COOKIE_SECURE=true.
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}
app.cookie.secure=${COOKIE_SECURE:false}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.storage.upload-dir=${FILE_UPLOAD_DIR:uploads}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
logging.level.org.springframework.mail=WARN

# Request correlation: RequestLoggingFilter puts a per-request id in the MDC;
# surface it after the level on every log line (blank outside a request, e.g.
# startup and scheduled jobs).
logging.pattern.level=%5p [%X{requestId:-}]
