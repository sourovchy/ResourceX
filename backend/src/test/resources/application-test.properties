spring.datasource.url=jdbc:h2:mem:resourcex_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Test-only JWT secret. The default in application.properties is unresolved
# when no .env file is present, so any @SpringBootTest would fail to load the
# context. A long, fixed secret is safe here because tests never issue real
# tokens that leave the JVM.
jwt.secret=test-jwt-secret-please-change-me-this-must-be-at-least-32-bytes-long
jwt.expiration=3600000
